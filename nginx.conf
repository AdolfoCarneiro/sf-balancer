# Reproduz o essencial do vercel.json: cleanUrls, /en -> /, /pt e /es servindo o builder (index.html) e
# /pt/balancer, /es/balancer servindo a ferramenta (balancer.html); /planner* (o endereço antigo do builder) redireciona.
# Precisa espelhar as rotas (rewrites e redirects) do vercel.json: mudou um, muda o outro.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /en { return 301 /; }
  location = /en/balancer { return 301 /balancer; }
  location = /planner { return 301 /; }
  location = /planner.html { return 301 /; }
  location = /en/planner { return 301 /; }
  location ~ ^/(pt|es)/planner/?$ { return 301 /$1; }

  location ~ ^/(pt|es)/?$ { try_files /index.html =404; }
  location ~ ^/(pt|es)/balancer/?$ { try_files /balancer.html =404; }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
