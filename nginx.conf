# Reproduz o essencial do vercel.json: cleanUrls, /en -> / e /pt, /es servindo o index.html.
# Precisa espelhar as rotas (rewrites e redirects) do vercel.json: mudou um, muda o outro.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /en { return 301 /; }
  location ~ ^/(pt|es)/?$ { try_files /index.html =404; }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
