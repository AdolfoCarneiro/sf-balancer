# Reproduz o essencial do vercel.json: cleanUrls (cada rota é um arquivo .html gerado no build), /en -> / e /planner* (o
# endereço antigo do builder) redirecionam.
# Precisa espelhar as rotas (rewrites e redirects) do vercel.json: mudou um, muda o outro.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /en { return 301 /$is_args$args; }
  location = /en/balancer { return 301 /balancer$is_args$args; }
  location = /planner { return 301 /$is_args$args; }
  location = /planner.html { return 301 /$is_args$args; }
  location = /en/planner { return 301 /$is_args$args; }
  location ~ ^/(pt|es)/planner/?$ { return 301 /$1$is_args$args; }

  # /pt, /pt/balancer, /balancer/3-to-4…: cada página é um arquivo gerado no build (src/seo/pages.js); a barra no fim cai fora.
  location ~ ^(/.+)/$ { return 301 $1$is_args$args; }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
