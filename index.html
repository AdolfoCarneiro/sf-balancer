<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belt Logistics Planner</title>
<meta name="description" content="Plan belts, mergers, splitters and load balancers between two stages of a Satisfactory factory.">
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0d2136;
    --plate: #15324f;
    --grid: #1a3858;
    --grid-fine: #13304c;
    --ink: #e4eef8;
    --ink-dim: #8eabc6;
    --line: #2d5176;
    --ficsit: #ff9b3d;
    --flow: #e4eef8;
    --donor: #c6a6ff;
    --sink: #ff6d7c;
    --held: #7f9bb8;
    --ok: #8fe3a4;
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cut: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font: 15px/1.5 var(--body);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      linear-gradient(var(--grid-fine) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 28px 56px; }
  @media (max-width: 760px) { .wrap { padding: 0 16px 40px; } }
  .num { font-variant-numeric: tabular-nums; }

  /* Placas com canto chanfrado, como os painéis do jogo. */
  .plate {
    background: var(--plate);
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
    padding: 16px 18px 18px;
  }

  /* Seletor de idioma */
  .langbar { display: flex; justify-content: flex-end; padding-top: 14px; }
  .langs { display: flex; border: 1px solid var(--line); }
  .langs button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; border-left: 1px solid var(--line); color: var(--ink-dim); cursor: pointer; padding: 5px 10px; font: 600 13px var(--display); }
  .langs svg { width: 20px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); opacity: .7; }
  .langs button:hover svg, .langs button[aria-pressed="true"] svg { opacity: 1; }
  .langs button:first-child { border-left: 0; }
  .langs button:hover { color: var(--ink); }
  .langs button[aria-pressed="true"] { background: var(--plate); color: var(--ficsit); }
  .langs button:focus-visible { outline: 2px solid var(--ficsit); outline-offset: -2px; }

  /* Cabeçalho */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 40px; flex-wrap: wrap; padding: 6px 0 20px; }
  .kicker { margin: 0 0 2px; color: var(--ink-dim); font: 500 15px var(--display); }
  .item-name {
    font: 700 46px/1.05 var(--display);
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px dashed transparent;
    padding: 0;
    width: min(620px, 100%);
  }
  .item-name:hover { border-bottom-color: var(--line); }
  .item-name:focus { outline: none; border-bottom-color: var(--ficsit); }
  .ledger { display: flex; margin: 0; }
  .ledger div { padding: 0 22px; border-left: 1px solid var(--line); }
  .ledger div:first-child { border-left: 0; padding-left: 0; }
  .ledger dt { color: var(--ink-dim); font-size: 13px; }
  .ledger dd { margin: 0; font: 600 34px/1.05 var(--display); }
  .ledger dd small { font: 500 14px var(--body); color: var(--ink-dim); margin-left: 3px; }
  .ledger .neg { color: var(--sink); }
  @media (max-width: 760px) { .item-name { font-size: 34px; } .ledger dd { font-size: 26px; } .ledger div { padding: 0 14px; } }

  /* Faixa de entrada: origem → destino, regras embaixo */
  .band { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); align-items: stretch; }
  .band > section, .work > *, .pair > * { min-width: 0; }
  .arrow { position: relative; }
  .arrow::before { content: ""; position: absolute; left: 0; right: 10px; top: 50%; height: 10px; margin-top: -5px;
    background: repeating-linear-gradient(90deg, var(--ficsit) 0 8px, transparent 8px 14px); opacity: .7; }
  .arrow::after { content: ""; position: absolute; right: 0; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 12px solid var(--ficsit); border-right: 0; }
  .rules { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 36px; align-items: flex-start; padding: 12px 18px; }
  .rules .rule { display: flex; flex-direction: column; gap: 2px; }
  .rules .rule h3 { font: 600 15px var(--display); margin: 0 0 2px; color: var(--ink-dim); }
  .rules .inline { display: flex; gap: 16px; flex-wrap: wrap; }
  @media (max-width: 1100px) {
    .band { grid-template-columns: 1fr; gap: 12px; }
    .arrow { display: none; }
  }
  .plate h2 { font: 600 21px/1.1 var(--display); margin: 0 0 6px; }
  .field {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 0;
    padding: 7px 9px;
    font: 500 15px var(--body);
    font-variant-numeric: tabular-nums;
  }
  .field:focus-visible { outline: 2px solid var(--ficsit); outline-offset: 0; border-color: var(--ficsit); }
  .field.invalid { border-color: var(--sink); }
  .field::placeholder { color: var(--ink-dim); opacity: .85; }
  .field.drives { box-shadow: inset 0 -3px 0 var(--ficsit); }

  /* Grupos de máquinas (origem e destino usam o mesmo formato) */
  .grp { border-top: 1px solid var(--line); padding: 10px 0 4px; }
  .grp:first-child { border-top: 0; padding-top: 2px; }
  .grp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .grp-name { font: 600 14px var(--display); color: var(--ink-dim); }
  .grp-fields { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .grp-fields label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-dim); line-height: 1.2; }
  .grp-fields label span { min-height: 2.4em; display: flex; align-items: flex-end; }
  @media (max-width: 600px) { .grp-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grp-fields .field { padding: 7px 6px; font-size: 14px; } }
  .eq { margin: 6px 0 0; font-size: 13px; color: var(--ink-dim); }
  .eq b { color: var(--ink); font-weight: 600; }
  .rm { background: none; border: 0; color: var(--ink-dim); cursor: pointer; padding: 0; font: 500 13px var(--body); }
  .rm:hover { color: var(--sink); }
  .rm[hidden] { display: none; }
  .rm:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--ficsit); outline-offset: 2px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--ficsit); cursor: pointer; font: 500 14px var(--body); margin-top: 8px; }
  .linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .hint { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; }
  .choice { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 3px 0; cursor: pointer; }
  .choice input { accent-color: var(--ficsit); margin: 0; }
  select.field { width: auto; min-width: 170px; }

  .warns { display: flex; flex-direction: column; gap: 4px; margin: 14px 0 0; }
  .warn { font-size: 14px; padding-left: 14px; position: relative; max-width: 100ch; }
  .warn::before { content: ""; position: absolute; left: 0; top: 7px; width: 7px; height: 7px; background: var(--ficsit); transform: rotate(45deg); }
  .warn.bad::before { background: var(--sink); }

  /* Área de trabalho: alternativas à esquerda, planta à direita */
  .work { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; margin-top: 24px; align-items: start; }
  @media (max-width: 1100px) { .work { grid-template-columns: 1fr; } }
  .section-title { font: 600 24px/1.1 var(--display); margin: 0 0 4px; }
  .lead { margin: 0 0 12px; color: var(--ink-dim); font-size: 14px; max-width: 70ch; }

  .alts { display: flex; flex-direction: column; gap: 8px; }
  .alt {
    display: block; width: 100%; text-align: left; cursor: pointer; color: var(--ink);
    background: var(--plate); border: 0; padding: 12px 14px 12px 16px; font: inherit;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    position: relative;
  }
  .alt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent; }
  .alt:hover { background: #1a3b5d; }
  .alt.sel { background: #1d4269; }
  .alt.sel::before { background: var(--ficsit); }
  .alt:focus-visible { outline: 2px solid var(--ficsit); outline-offset: -2px; }
  .alt-title { font: 600 16px/1.25 var(--display); display: block; }
  .alt-sub { display: block; color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
  .rec { color: var(--ficsit); font-size: 12.5px; font-weight: 600; display: block; margin-bottom: 2px; }
  .stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 2px 16px; margin: 8px 0 0; }
  .stats dt { font-size: 11.5px; color: var(--ink-dim); }
  .stats dd { margin: 0; font: 600 15px var(--display); font-variant-numeric: tabular-nums; }

  .sheet {
    position: relative;
    border: 1px solid var(--line);
    background: rgba(13, 33, 54, .55);
    padding: 18px 18px 64px;
    overflow-x: auto;
  }
  .titleblock {
    position: absolute; right: 0; bottom: 0;
    display: grid; grid-template-columns: auto auto auto; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    font-size: 12px; color: var(--ink-dim); background: var(--paper);
  }
  .titleblock div { padding: 5px 12px; border-right: 1px solid var(--line); }
  .titleblock div:last-child { border-right: 0; }
  .titleblock b { display: block; color: var(--ink); font: 600 14px var(--display); }
  svg { display: block; }
  svg text { font-family: var(--body); fill: var(--ink); font-size: 13px; }
  svg .lbl { font-family: var(--display); font-weight: 600; font-size: 15px; }
  svg .sm { font-size: 11.5px; fill: var(--ink-dim); }
  svg .rate { font-family: var(--display); font-weight: 600; font-size: 13.5px; }
  .items { stroke-dasharray: 2 10; stroke-linecap: round; animation: run var(--dur, 2s) linear infinite; }
  @keyframes run { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) { .items { animation: none; } }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-dim); margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 20px; height: 4px; }
  .legend i.held { height: 10px; width: 14px; background: repeating-linear-gradient(135deg, var(--held) 0 2px, transparent 2px 5px); border: 1px solid var(--held); }
  .legend i.piece { width: 10px; height: 10px; border: 2px solid var(--ficsit); transform: rotate(45deg); }
  .legend i.smart { width: 12px; height: 12px; border: 2px solid var(--ficsit); }

  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
  @media (max-width: 1100px) { .pair { grid-template-columns: 1fr; } }

  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { font-size: 12.5px; color: var(--ink-dim); font-weight: 500; }
  td.l, th.l { text-align: left; }
  td .sm { color: var(--ink-dim); font-size: 12.5px; }
  tr.sum td { font-weight: 600; border-bottom: 0; }
  .ok { color: var(--ok); }
  .bad { color: var(--sink); }
  .dim { color: var(--ink-dim); }
  .plate .section-title { font-size: 21px; margin-bottom: 10px; }

  ol.steps { margin: 0; padding-left: 26px; }
  ol.steps li { margin: 7px 0; padding-left: 4px; }
  ol.steps li::marker { color: var(--ficsit); font: 600 15px var(--display); }

  .bal { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .bal { grid-template-columns: 1fr; } }
  .opt { border-top: 2px solid var(--line); padding-top: 8px; }
  .opt.on { border-top-color: var(--ficsit); }
  .opt h4 { margin: 0 0 4px; font: 600 16px var(--display); }
  .opt ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .opt li { margin: 3px 0; }
  .donor-title { font: 600 17px var(--display); margin: 14px 0 6px; }
  .donor-title:first-of-type { margin-top: 0; }
  .foot { margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="langbar">
    <div class="langs" role="group" id="langs" data-i18n-aria="langLabel" aria-label="Language"></div>
  </nav>
  <header class="top">
    <div>
      <p class="kicker" data-i18n="kicker">Logistics between stages</p>
      <input class="item-name" id="item" value="Iron Ingot" data-i18n-aria="itemAria" aria-label="Item name" spellcheck="false">
    </div>
    <dl class="ledger num" id="ledger"></dl>
  </header>

  <div id="form">
    <div class="band">
      <section class="plate">
        <h2 data-i18n="sideSrc">Source</h2>
        <div id="srcGroups"></div>
        <button class="linkbtn" data-add="src" data-i18n="addGroup" type="button">+ Add machine group</button>
      </section>
      <div class="arrow" aria-hidden="true"></div>
      <section class="plate">
        <h2 data-i18n="sideDst">Destination</h2>
        <div id="dstGroups"></div>
        <button class="linkbtn" data-add="dst" data-i18n="addGroup" type="button">+ Add machine group</button>
      </section>
    </div>
    <section class="plate rules">
      <div class="rule">
        <h3 data-i18n="belt">Belt</h3>
        <select class="field" id="belt" data-i18n-aria="beltAria" aria-label="Belt tier"></select>
      </div>
      <div class="rule">
        <h3 data-i18n="policyTitle">Source lines with no destination</h3>
        <div class="inline">
          <label class="choice"><input type="radio" name="policy" value="represar" checked> <span data-i18n="policyHold">Stay idle</span></label>
          <label class="choice"><input type="radio" name="policy" value="sink"> <span data-i18n="policySink">Go to the Awesome Sink</span></label>
          <label class="choice"><input type="radio" name="policy" value="extra"> <span data-i18n="policyExtra">Leave on an extra line</span></label>
        </div>
      </div>
      <div class="rule">
        <h3 data-i18n="convTitle">Pieces per manifold</h3>
        <div class="inline">
          <label class="choice"><input type="radio" name="conv" value="k-1" checked> <span data-i18n="convK1">k machines, k−1 pieces</span></label>
          <label class="choice"><input type="radio" name="conv" value="k"> <span data-i18n="convK">k machines, k pieces</span></label>
        </div>
      </div>
    </section>
  </div>
  <div class="warns" id="warns"></div>

  <div id="out"></div>

  <div class="foot hint">
    <button class="linkbtn" id="reset" data-i18n="reset" type="button">Back to the refinery example</button>
  </div>
</div>

<template id="grpTpl">
  <div class="grp">
    <div class="grp-head"><span class="grp-name"></span><button class="rm" data-i18n="removeGroup" type="button">Remove group</button></div>
    <div class="grp-fields">
      <label><span data-i18n="fMachines">Machines</span><input class="field g-count" type="text" inputmode="decimal"></label>
      <label><span data-i18n="fClock">Clock %</span><input class="field g-clock" type="text" inputmode="decimal"></label>
      <label><span class="g-nom-label"></span><input class="field g-nom" type="text" inputmode="decimal"></label>
      <label><span data-i18n="fTotal">Total /min</span><input class="field g-total" type="text" inputmode="decimal"></label>
      <label><span data-i18n="fPer">Per line</span><input class="field g-per" type="text" inputmode="numeric"></label>
    </div>
    <p class="eq num"></p>
  </div>
</template>

<script>
// LOGIC-START: funções puras, testadas em tests/logic.test.js

// ---- Idiomas ----
// Todo texto que aparece na tela vem daqui. Chave nova entra nos três idiomas (o teste confere).
// Nomes de peças do jogo (Merger, Splitter, Smart Splitter, Awesome Sink, Any, Overflow) ficam em inglês nos três.
const I18N = {
  pt: {
    locale: 'pt-BR', htmlLang: 'pt-BR', langName: 'Português',
    pageTitle: 'Logística entre Etapas',
    metaDesc: 'Planeje esteiras, mergers, splitters e balancers entre duas etapas de uma fábrica no Satisfactory.',
    langLabel: 'Idioma',
    defaultItem: 'Barra de ferro', fallbackItem: 'Item',
    kicker: 'Logística entre etapas', itemAria: 'Nome do item',
    sideSrc: 'Origem', sideDst: 'Destino',
    addGroup: '+ Adicionar grupo de máquinas',
    belt: 'Esteira', beltAria: 'Tier da esteira',
    policyTitle: 'Linhas de origem sem destino',
    policyHold: 'Ficam paradas', policySink: 'Vão pro Awesome Sink', policyExtra: 'Saem numa linha extra',
    convTitle: 'Peças por manifold', convK1: 'k máquinas, k−1 peças', convK: 'k máquinas, k peças',
    reset: 'Voltar ao exemplo das refinarias',
    removeGroup: 'Remover grupo',
    fMachines: 'Máquinas', fClock: 'Clock %', fNomSrc: 'Cada uma produz a 100% /min', fNomDst: 'Cada uma consome a 100% /min', fTotal: 'Total /min', fPer: 'Por linha',
    group: 'Grupo', groupN: n => `Grupo ${n}`, groupOf: (side, n) => `${side}, grupo ${n}`, perAuto: n => `auto ${n}`,
    tagSrc: 'O', tagDst: 'D',
    warnClock: (name, pct) => `${name}: clock de ${pct}% fica fora do que o jogo permite (1% a 250%).`,
    warnMachineOverBelt: (name, per, cap, over) => `${name}: cada máquina movimenta ${per}/min, mas a esteira leva ${cap}/min. Cada uma fica numa linha só dela e ${over}/min ficam de fora.`,
    warnPerLineOver: (name, n, rate, cap, max) => `${name}: ${n} máquinas por linha dão ${rate}/min, acima da esteira (${cap}/min). O máximo é ${max}.`,
    continuousFlow: 'fluxo contínuo',
    treeNone: 'sem divisão',
    treeDesc: (levels, parts) => levels.map((lv, i) => `${lv.count} splitter${lv.count > 1 ? 's' : ''} em ${lv.ways}` + (i === 0 ? '' : ' (um em cada saída)')).join(', depois ') + ` = ${parts} partes`,
    warnLoopBelt: load => `A esteira que entra no balancer carrega ${load}/min (doadora mais o retorno do loop), acima da capacidade. Use uma esteira melhor só nesse trecho.`,
    warnSinkPart: (donor, n, part, def) => `Dividindo a doadora ${donor} em ${n}, cada parte leva ${part}/min, menos que o déficit de ${def}/min.`,
    casePartial: 'atende em parte', caseA: 'caso A', caseB: 'caso B', caseC: 'caso C', caseCB: 'caso C + B', caseD: 'caso D, redistribuição',
    planDirect: 'Ligação direta', planDirectSub: 'Uma linha de origem em cada destino, sem peças no meio. O que não cabe represa.',
    planDirectSink: 'Ligação direta, excesso pro sink', planDirectSinkSub: 'Smart Splitter com overflow antes de cada destino que recebe mais do que consome.',
    planRedist: 'Excesso de uma linha cobre a falta de outra', planRedistSub: 'Smart Splitter com overflow nas linhas que sobram; o excesso vai pro merger do destino que falta. Splitter comum não serve: ele divide igual e deixa o destino principal com fome.',
    planMerge: 'Juntar linhas inteiras', planMergeSub: 'Várias linhas de origem num merger por destino, sem dividir nada. O excesso represa.',
    planDonor: (multi, kd, v) => (multi ? 'Juntar linhas + complemento' : 'Complemento') + ` com ${kd} doadora${kd > 1 ? 's' : ''}` + (v === 'sink' ? ', partes a mais pro sink' : v === 'loop' ? ', balancer com loop' : ''),
    planDonorSubDirect: 'Cada doadora é dividida em partes iguais só com splitters, uma parte por destino.',
    planDonorSubSink: 'Divide a doadora num número que o splitter alcança e manda as partes a mais pro sink.',
    planDonorSubLoop: 'Balancer com loop: divisão exata, sem sink. A sobra represa na doadora.',
    warnDemand: (d, s, m) => `A demanda (${d}/min) é maior que a oferta (${s}/min).` + (m ? ` A oferta sustenta ${m} máquinas de destino a 100%.` : ''),
    warnCollectMixed: (n, list) => `Coleta: ${n === 1 ? 'uma linha fica' : `${n} linhas ficam`} com as máquinas que sobraram (${list}).`,
    warnDistMixed: (n, list) => `Distribuição: ${n === 1 ? 'uma linha fica' : `${n} linhas ficam`} incompleta${n > 1 ? 's' : ''} (${list}).`,
    eqContinuous: (total, lines, cap) => `Fluxo contínuo de <b>${total}/min</b>, em ${lines} esteira${lines > 1 ? 's' : ''} de até ${cap}. Preencha a taxa a 100% para ver em máquinas.`,
    eqMachines: ({ n, one, N, clock, total, src, per, perLine, lineRate }) => `<b>${n}</b> máquina${one ? '' : 's'} a 100% = <b>${N}</b> a <b>${clock}%</b> = <b>${total}/min</b>. Cada uma ${src ? 'produz' : 'consome'} ${per}/min; ${perLine} por linha dão ${lineRate}/min.`,
    invalid: 'Os campos marcados em vermelho precisam de um número positivo. Máquinas e clock precisam da taxa a 100%; o total funciona sozinho.',

  { id: 'Mk1', cap: 60 }, { id: 'Mk2', cap: 120 }, { id: 'Mk3', cap: 270 },
  { id: 'Mk4', cap: 480 }, { id: 'Mk5', cap: 780 }, { id: 'Mk6', cap: 1200 },

const EPS = 1e-6;
const INF = Infinity;

// Aceita o formato novo ({ driver, count, clock, nominal, total, per }) e o antigo ({ mode, count, rate, per }).
function normalizeGroup(g) {
  if (g.driver) return g;
  if (g.mode === 'total') return { driver: 'total', total: g.rate, per: g.per };
  return { driver: 'machines', count: g.count, nominal: g.rate, per: g.per };
}

// O campo que manda define o grupo: máquinas fracionadas, inteiras com clock, ou total.
// Devolve as três equivalências e a taxa real de cada máquina.
function resolveGroup(raw) {
  const g = normalizeGroup(raw);
  const nominal = g.nominal > 0 ? g.nominal : 0;
  let n, N, total;
  if (g.driver === 'total') {
    total = g.total;
    if (!nominal) return { continuous: true, total, per: g.per || 0 };
    n = total / nominal;
    N = Math.max(1, Math.ceil(n - EPS));
  } else if (g.driver === 'clock') {
    N = Math.max(1, Math.ceil(g.count - EPS));
    total = g.count * nominal * g.clock / 100;
    n = total / nominal;
  } else {
    n = g.count;
    N = Math.max(1, Math.ceil(n - EPS));
    total = n * nominal;
  }
  const perMachine = total / N;
  return { continuous: false, n, N, total, perMachine, clock: perMachine / nominal, nominal, per: g.per || 0 };
}

// Linhas de esteira a partir de vários grupos. Cada grupo enche linhas com a taxa real por máquina;
// as máquinas que sobram de cada grupo são empacotadas juntas, maior primeiro.
function buildLines(groups, cap, side = t('group')) {
  const lines = [], info = [], warnings = [], loose = [];
  const name = gi => (groups.length > 1 ? t('groupOf', side, gi + 1) : side);
  groups.forEach((raw, gi) => {
    const r = resolveGroup(raw);
    if (r.continuous) {
      const full = Math.floor(r.total / cap + EPS);
      for (let i = 0; i < full; i++) lines.push({ machines: 0, rate: cap, partial: false, comp: [{ gi, total: true, rate: cap }] });
      const rem = r.total - full * cap;
      if (rem > EPS) lines.push({ machines: 0, rate: rem, partial: true, comp: [{ gi, total: true, rate: rem }] });
      info.push({ gi, ...r, lines: full + (rem > EPS ? 1 : 0) });
      return;
    }
    if (r.clock > 2.5 + EPS || r.clock < 0.01 - EPS) warnings.push({ level: 'warn', text: t('warnClock', name(gi), fmt(r.clock * 100, 2)) });
    const eff = Math.min(r.perMachine, cap);
    if (r.perMachine > cap + EPS) warnings.push({ level: 'warn', text: t('warnMachineOverBelt', name(gi), fmt(r.perMachine), fmt(cap), fmt(r.perMachine - cap)) });
    const auto = Math.max(1, Math.floor(cap / eff + EPS));
    const perLine = r.per > 0 ? Math.floor(r.per) : auto;
    if (perLine * eff > cap + EPS) warnings.push({ level: 'bad', text: t('warnPerLineOver', name(gi), perLine, fmt(perLine * eff), fmt(cap), auto) });
    const full = Math.floor(r.N / perLine);
    for (let i = 0; i < full; i++) lines.push({ machines: perLine, rate: perLine * eff, partial: false, comp: [{ gi, count: perLine, rate: eff }] });
    const rem = r.N - full * perLine;
    for (let i = 0; i < rem; i++) loose.push({ gi, rate: eff });
    info.push({ gi, ...r, auto, perLine, fullLines: full, lineRate: perLine * eff, rem });
  });
  loose.sort((a, b) => b.rate - a.rate || a.gi - b.gi);
  const packed = [];
  for (const m of loose) {
    let line = packed.find(l => l.rate + m.rate <= cap + EPS);
    if (!line) { line = { machines: 0, rate: 0, partial: true, comp: [] }; packed.push(line); }
    line.machines++;
    line.rate += m.rate;
    const c = line.comp.find(x => x.gi === m.gi);
    if (c) c.count++; else line.comp.push({ gi: m.gi, count: 1, rate: m.rate });
  }
  lines.push(...packed);
  return { lines, groups: info, packed: packed.length, warnings, total: lines.reduce((a, l) => a + l.rate, 0) };
}

// Texto curto da composição de uma linha: "12 × 39,4" ou "1 × 200 + 1 × 120".
function lineComp(l) {
  if (!l.comp) return `${l.machines} × ${fmt(l.rate / Math.max(1, l.machines))}`;
  return l.comp.map(c => (c.total ? t('continuousFlow') : `${c.count} × ${fmt(c.rate)}`)).join(' + ');
}

// Resumo das taxas: "5 × 455 + 1 × 300".
function summarizeRates(lines) {
  const counts = [];
  for (const l of lines) {
    const c = counts.find(x => Math.abs(x.rate - l.rate) < EPS);
    if (c) c.n++; else counts.push({ rate: l.rate, n: 1 });
  }
  return counts.map(c => `${c.n} × ${fmt(c.rate)}`).join(' + ');
}

// Peças de manifold (mergers na coleta, splitters na distribuição).
function manifoldPieces(lines, conv) {
  return lines.reduce((acc, l) => acc + (conv === 'k' ? l.machines : Math.max(0, l.machines - 1)), 0);
}

// Splitter só divide direto em produtos de 2 e 3.
function isDirect(n) {
  if (n < 1) return false;
  while (n % 2 === 0) n /= 2;
  while (n % 3 === 0) n /= 3;
  return n === 1;
}
function nextDirect(n) { let m = Math.max(1, n); while (!isDirect(m)) m++; return m; }

// Árvore de splitters para n partes (n direto): primeiro os 3, depois os 2.
function splitTree(n) {
  const factors = [];
  let m = n;
  while (m % 3 === 0) { factors.push(3); m /= 3; }
  while (m % 2 === 0) { factors.push(2); m /= 2; }
  let splitters = 0, prod = 1;
  const levels = [];
  for (const f of factors) { levels.push({ count: prod, ways: f }); splitters += prod; prod *= f; }
  return { parts: n, factors, levels, splitters };
}
function describeTree(tree) {
  if (tree.parts === 1) return t('treeNone');
  return t('treeDesc', tree.levels, tree.parts);
}

// Opções para dividir uma doadora de taxa s em p partes iguais, cada uma cobrindo maxDeficit.
function divisionOptions(s, p, maxDeficit, cap) {
  if (isDirect(p)) {
    const tree = splitTree(p);
    return { direct: true, p, n: p, tree, part: s / p, ok: s / p + EPS >= maxDeficit };
  }
  const n = nextDirect(p);
  const tree = splitTree(n);
  const loopLoad = s * n / p;
  return {
    direct: false, p, n, tree,
    loop: {
      part: s / p, ok: s / p + EPS >= maxDeficit,
      recirculate: n - p, mergers: 1, beltLoad: loopLoad, beltOk: loopLoad <= cap + EPS,
    },
    sink: { part: s / n, ok: s / n + EPS >= maxDeficit, sinkParts: n - p, sinkRate: s * (n - p) / n },
  };
}

// Mergers para juntar `inputs` esteiras numa só (merger tem até 3 entradas, em cascata).
function mergersFor(inputs) { return inputs <= 1 ? 0 : Math.ceil((inputs - 1) / 2); }

// Tamanhos de grupo (soma m, k grupos), preferindo tamanhos divisíveis direto.
function groupSizeCandidates(m, k) {
  const equal = [];
  for (let i = 0; i < k; i++) equal.push(Math.floor(m / k) + (i < m % k ? 1 : 0));
  const cands = [];
  const direct = [];
  let rem = m;
  for (let i = 0; i < k; i++) {
    const left = k - i;
    if (left === 1) { direct.push(rem); break; }
    let g = Math.ceil(rem / left);
    while (g > 1 && !isDirect(g)) g--;
    direct.push(g); rem -= g;
  }
  if (direct.length === k && direct.every(g => g >= 1 && isDirect(g)) && direct.reduce((a, b) => a + b, 0) === m) {
    cands.push(direct.slice().sort((a, b) => b - a));
  }
  cands.push(equal);
  return cands;
}

// Tenta cobrir os déficits com k doadoras (as maiores do pool).
function tryDonors(needs, pool, k, cap) {
  const donors = pool.slice(0, k);
  for (const sizes of groupSizeCandidates(needs.length, k)) {
    if (sizes.some(g => g < 1)) continue;
    const groups = [];
    let idx = 0, ok = true;
    for (let j = 0; j < k; j++) {
      const members = needs.slice(idx, idx + sizes[j]);
      idx += sizes[j];
      const maxDef = Math.max(...members.map(d => d.deficit));
      const opt = divisionOptions(donors[j].rate, sizes[j], maxDef, cap);
      const feasible = opt.direct ? opt.ok : opt.loop.ok;
      if (!feasible) { ok = false; break; }
      groups.push({ donor: donors[j], members, maxDeficit: maxDef, division: opt });
    }
    if (ok) return groups;
  }
  return null;
}

// Divide `total` igualmente entre saídas com limite `caps` (sobra de uma vai para as outras).
function waterfill(total, caps) {
  const out = new Array(caps.length).fill(0);
  const order = caps.map((_, i) => i).sort((a, b) => caps[a] - caps[b]);
  let rem = Math.max(0, total), left = caps.length;
  for (let k = 0; k < order.length; k++) {
    const i = order[k];
    const share = rem / left;
    if (caps[i] <= share) { out[i] = caps[i]; rem -= caps[i]; left--; }
    else { for (let j = k; j < order.length; j++) out[order[j]] = share; break; }
  }
  return out;
}

// ---- Grafo de esteiras e simulação do regime permanente ----
function makeGraph(cap) { return { cap, nodes: [], edges: [] }; }

  return n.id;
}
function addEdge(g, from, to) {
  const id = g.edges.length;
  g.edges.push({ id, from, to });
  g.nodes[from].outs.push(id);
  g.nodes[to].ins.push(id);
  return id;
}
function topoOrder(g) {
  const indeg = g.nodes.map(n => n.ins.length);
  const queue = g.nodes.filter(n => !n.ins.length).map(n => n.id);
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(g.nodes[id]);
    for (const e of g.nodes[id].outs) if (--indeg[g.edges[e].to] === 0) queue.push(g.edges[e].to);
  }
  return order;
}

// Merger: round-robin entre entradas com item, limitado pelo que a saída aceita.
// Splitter: divide igual entre saídas que aceitam. Smart splitter (overflow): saída 1 primeiro, resto na 2.
// Balancer: divisão ideal em p partes (balancer com loop).
function simulate(g) {
  const cap = g.cap;

  const acc = g.edges.map(() => cap), off = g.edges.map(() => 0), flow = g.edges.map(() => 0);
  const sum = (ids, arr) => ids.reduce((a, e) => a + arr[e], 0);

    let delta = 0;
    for (const n of order) {
      const inFlow = sum(n.ins, flow), inOff = sum(n.ins, off);
      const set = (e, f, o) => { delta = Math.max(delta, Math.abs(flow[e] - f)); flow[e] = f; off[e] = Math.min(cap, o); };
      if (n.type === 'source') {
        for (const e of n.outs) set(e, Math.min(n.rate, cap, acc[e]), n.rate);
      } else if (n.type === 'splitter' || n.type === 'balancer') {
        const a = n.outs.map(e => acc[e]);
        const f = waterfill(inFlow, a);

          const a2 = a.slice(); a2[j] = INF;
          set(e, f[j], waterfill(inOff, a2)[j]);
        });
      } else if (n.type === 'overflow') {
        const [p, o] = n.outs;
        const fp = Math.min(inFlow, acc[p]);
        set(p, fp, inOff);
        set(o, Math.min(inFlow - fp, acc[o]), Math.max(0, inOff - acc[p]));
      } else if (n.type === 'merger') {
        for (const e of n.outs) set(e, Math.min(inFlow, acc[e]), inOff);
      }
    }
    for (let k = order.length - 1; k >= 0; k--) {
      const n = order[k];
      n.ins.forEach((e, idx) => {

        else if (n.type === 'sink' || n.type === 'extra') a = cap;

// Liga `froms` em `to`, com mergers em cascata quando há mais de uma entrada.
function connectMany(g, froms, to) {
  if (froms.length === 1) { const e = addEdge(g, froms[0], to); return { inEdges: [e], outEdge: e, mergers: 0, mergeNode: null }; }
  const inEdges = [];
  let prev = null, i = 0, mergers = 0;
  while (i < froms.length) {
    const m = addNode(g, 'merger');
    mergers++;
    if (prev !== null) addEdge(g, prev, m);
    const take = prev === null ? 3 : 2;
    for (let k = 0; k < take && i < froms.length; k++, i++) inEdges.push(addEdge(g, froms[i], m));
    prev = m;
  }
  return { inEdges, outEdge: addEdge(g, prev, to), mergers, mergeNode: prev };
}

// Árvore de splitters; devolve a raiz e um "slot" (nó splitter) por saída.
function buildTree(g, tree) {
  const root = addNode(g, 'splitter');
  let level = [root];
  for (let li = 0; li < tree.factors.length - 1; li++) {
    const next = [];
    for (const n of level) for (let k = 0; k < tree.factors[li]; k++) { const c = addNode(g, 'splitter'); addEdge(g, n, c); next.push(c); }
    level = next;
  }
  const last = tree.factors[tree.factors.length - 1];
  const slots = [];
  for (const n of level) for (let k = 0; k < last; k++) slots.push(n);
  return { root, slots };
}

// Feeds com `overflow` passam por um Smart Splitter: saída principal no destino,
// overflow pro sink (overflowTo vazio) ou pro merger de outro destino (overflowTo = id do destino).
function buildGraph(plan, cap) {
  const g = makeGraph(cap);

  const slotByDst = new Map();
  plan.groups.forEach((gr, gi) => {
    const donor = srcNode.get(gr.donor.id);

      v.splitters = gr.tree.splitters;
      v.extraMergers = 1;

      v.root = tr.root;
      v.donorEdge = addEdge(g, donor, tr.root);
      slots = tr.slots.slice(0, p);
      sinkSlots = tr.slots.slice(p);
      v.splitters = gr.tree.splitters;
    }
    gr.members.forEach((dstId, i) => slotByDst.set(dstId, { slot: slots[i], group: gi }));
    v.sinkEdges = sinkSlots.map(s => addEdge(g, s, sink));
    view.groups.push(v);
  });

  // Primeiro os Smart Splitters, para a saída principal ser a primeira do nó.
  const fv = new Map(), ovNode = new Map();
  plan.feeds.filter(f => f.overflow).forEach(f => {
    const c = consumer.get(f.dst.id);
    const ov = addNode(g, 'overflow');
    const conn = connectMany(g, f.mains.map(l => srcNode.get(l.id)), ov);
    const outEdge = addEdge(g, ov, c);
    const toSink = f.overflowTo === undefined || f.overflowTo === null;
    ovNode.set(f.dst.id, ov);
    fv.set(f.dst.id, {
      f, consumer: c, mainEdges: conn.inEdges.slice(0, f.mains.length), partEdge: null, outEdge,
      mergers: conn.mergers, mergeNode: conn.mergeNode, overflowNode: ov,
      sinkEdge: toSink ? addEdge(g, ov, sink) : null, overflowEdge: null, overflowTo: toSink ? null : f.overflowTo,
      inbound: [], group: null,
    });
  });
  plan.feeds.filter(f => !f.overflow).forEach(f => {
    const c = consumer.get(f.dst.id);
    const froms = f.mains.map(l => srcNode.get(l.id));
    const slot = slotByDst.get(f.dst.id);
    if (slot) froms.push(slot.slot);
    const senders = plan.feeds.filter(x => x.overflow && x.overflowTo === f.dst.id);
    senders.forEach(x => froms.push(ovNode.get(x.dst.id)));
    const conn = connectMany(g, froms, c);
    const nm = f.mains.length;
    const inbound = senders.map((x, i) => ({ from: x.dst.id, edge: conn.inEdges[nm + (slot ? 1 : 0) + i] }));
    inbound.forEach(ib => { fv.get(ib.from).overflowEdge = ib.edge; });
    fv.set(f.dst.id, {
      f, consumer: c, mainEdges: conn.inEdges.slice(0, nm), partEdge: slot ? conn.inEdges[nm] : null, outEdge: conn.outEdge,
      mergers: conn.mergers, mergeNode: conn.mergeNode, overflowNode: null, sinkEdge: null, overflowEdge: null, overflowTo: null,
      inbound, group: slot ? slot.group : null,
    });
  });
  view.feeds = plan.feeds.map(f => fv.get(f.dst.id));
  view.groups.forEach((v, gi) => {
    if (v.donorEdge === null) v.donorEdge = view.feeds.find(x => x.group === gi).partEdge;
  });

  plan.leftovers.forEach(l => {
    const n = srcNode.get(l.id);
    const to = plan.policy === 'sink' ? sink : plan.policy === 'extra' ? extra : null;
    view.leftovers.push({ line: l, node: n, edge: to === null ? null : addEdge(g, n, to) });
  });
  return { g, view };
}

function evaluatePlan(plan, cap) {
  const { g, view } = buildGraph(plan, cap);
  const sim = simulate(g);
  const sumE = ids => ids.reduce((a, e) => a + sim.flow[e], 0);
  const sources = new Map(), dests = new Map();
  for (const n of g.nodes) {
    if (n.type === 'source') {
      const out = sumE(n.outs);
      sources.set(n.line.id, { line: n.line, out, held: Math.max(0, n.line.rate - out) });
    } else if (n.type === 'consumer') {
      const got = sumE(n.ins);
      dests.set(n.line.id, { line: n.line, got, short: Math.max(0, n.line.rate - got) });
    }
  }
  const sinkRate = sumE(g.nodes[view.sink].ins);
  const extraRate = sumE(g.nodes[view.extra].ins);
  let held = 0, served = 0, demand = 0;
  sources.forEach(s => { held += s.held; });
  dests.forEach(d => { served += d.got; demand += d.line.rate; });
  const full = [...dests.values()].every(d => d.short < 0.05);
  const pieces = {
    mergers: view.feeds.reduce((a, f) => a + f.mergers, 0) + view.groups.reduce((a, v) => a + v.extraMergers, 0),
    splitters: view.groups.reduce((a, v) => a + v.splitters, 0),
    smart: view.feeds.filter(f => f.overflowNode !== null).length,
    sinkBelts: g.nodes[view.sink].ins.length,
  };
  const warnings = [];
  for (const v of view.groups) {
    const d = v.gr.division;
    if (v.gr.mode === 'loop' && !d.loop.beltOk) warnings.push(t('warnLoopBelt', fmt(d.loop.beltLoad)));
    if (v.gr.mode === 'sink' && !d.sink.ok) warnings.push(t('warnSinkPart', srcTag(v.gr.donor.id), d.n, fmt(d.sink.part), fmt(v.gr.maxDeficit)));
  }
  let caseLabel;
  if (!full) caseLabel = t('casePartial');
  else if (plan.kind === 'direct') caseLabel = t('caseA');
  else if (plan.kind === 'merge') caseLabel = t('caseC');
  else if (plan.kind === 'overflow') caseLabel = t('caseD');
  else caseLabel = plan.multi ? t('caseCB') : t('caseB');
  return { ...plan, g, view, sim, sources, dests, sinkRate, extraRate, held, served, demand, full, pieces, warnings, caseLabel };
}

// Gera as alternativas para ligar as linhas de origem nas de destino.
function generatePlans(srcLines, dstLines, cap, policy) {
  const S = srcLines.map((l, i) => ({ ...l, id: i })).sort((a, b) => b.rate - a.rate || a.id - b.id);
  const D = dstLines.map((l, i) => ({ ...l, id: i })).sort((a, b) => b.rate - a.rate || a.id - b.id);
  if (!S.length || !D.length) return [];
  const plans = [];
  const mk = (key, kind, title, feeds, groups, leftovers, extra) => ({
    key, kind, title, feeds, groups, leftovers, policy,
    unfed: D.filter(d => !feeds.some(f => f.dst.id === d.id)),
    ...extra,
  });

  // Melhor encaixe: cada destino (do maior pro menor) pega a menor linha que o cobre sozinha;
  // se nenhuma cobre, pega a maior que sobrou. Com linhas iguais dá o mesmo que parear em ordem.
  const avail = S.slice();
  const fit = [];
  for (const d of D) {
    if (!avail.length) break;
    const covering = avail.filter(l => l.rate + EPS >= d.rate);
    const pick = covering.length ? covering[covering.length - 1] : avail[0];
    avail.splice(avail.indexOf(pick), 1);
    fit.push({ dst: d, mains: [pick], deficit: Math.max(0, d.rate - pick.rate), excess: Math.max(0, pick.rate - d.rate) });
  }
  const direct = fit.map(f => ({ dst: f.dst, mains: f.mains }));
  plans.push(mk('direto', 'direct', t('planDirect'), direct, [], avail.slice(), { sub: t('planDirectSub') }));
  if (fit.some(f => f.excess > EPS)) {
    plans.push(mk('direto-sink', 'direct', t('planDirectSink'),
      direct.map((f, i) => ({ ...f, overflow: fit[i].excess > EPS })), [], avail.slice(), { sub: t('planDirectSinkSub') }));
  }

  // Redistribuição: o excesso de uma linha (Smart Splitter com overflow) completa o destino que falta.
  const exc = fit.filter(f => f.excess > EPS).sort((a, b) => b.excess - a.excess);
  const def = fit.filter(f => f.deficit > EPS).sort((a, b) => b.deficit - a.deficit);
  if (exc.length && def.length) {
    const spare = avail.slice().sort((a, b) => b.rate - a.rate);
    const sendTo = new Map(), extraMains = new Map();
    for (const tg of def) {
      let got = 0;
      while (got + EPS < tg.deficit && exc.length) { const e = exc.shift(); sendTo.set(e.dst.id, tg.dst.id); got += e.excess; }
      const add = [];
      while (got + EPS < tg.deficit && spare.length) { const l = spare.shift(); add.push(l); got += l.rate; }
      extraMains.set(tg.dst.id, add);
    }
    if (sendTo.size) {
      const feeds = fit.map(f => (sendTo.has(f.dst.id)
        ? { dst: f.dst, mains: f.mains, overflow: true, overflowTo: sendTo.get(f.dst.id) }
        : { dst: f.dst, mains: f.mains.concat(extraMains.get(f.dst.id) || []) }));
      plans.push(mk('redistribuir', 'overflow', t('planRedist'), feeds, [], spare, { sub: t('planRedistSub') }));
    }
  }

  const s = S[0].rate;
  const full = S.filter(l => Math.abs(l.rate - s) < EPS);
  const rest = S.filter(l => Math.abs(l.rate - s) >= EPS);

  const ceilQ = D.map(d => Math.max(1, Math.ceil(d.rate / s - EPS)));
  if (ceilQ.some(q => q > 1) && ceilQ.reduce((a, b) => a + b, 0) <= full.length) {
    let i = 0;
    const feeds = D.map((d, j) => { const mains = full.slice(i, i + ceilQ[j]); i += ceilQ[j]; return { dst: d, mains }; });
    plans.push(mk('juntar', 'merge', t('planMerge'), feeds, [], full.slice(i).concat(rest), { sub: t('planMergeSub') }));
  }

  // Complemento: divide doadoras do pool entre os destinos com déficit.
  const seenSig = new Set();
  const donorPlans = (base, pool, multi, tag) => {
    pool = pool.slice().sort((a, b) => b.rate - a.rate);
    const needs = base.filter(f => f.deficit > EPS).sort((a, b) => b.deficit - a.deficit);
    let found = 0;
    for (let kd = 1; needs.length && kd <= pool.length && found < 3; kd++) {
      const groups = tryDonors(needs, pool, kd, cap);
      if (!groups) continue;
      const sig = JSON.stringify([base.map(f => [f.dst.id, f.mains.map(l => l.id)]), groups.map(gr => [gr.donor.id, gr.members.map(f => f.dst.id)])]);
      if (seenSig.has(sig)) continue;
      seenSig.add(sig);
      found++;
      const allDirect = groups.every(gr => gr.division.direct);
      const variants = allDirect ? ['direct'] : ['sink', 'loop'];
      const used = new Set(groups.map(gr => gr.donor.id));
      for (const v of variants) {
        const gs = groups.map(gr => ({
          donor: gr.donor, members: gr.members.map(f => f.dst.id), maxDeficit: gr.maxDeficit,
          division: gr.division, mode: gr.division.direct ? 'direct' : v,
          tree: gr.division.tree, p: gr.division.p, n: gr.division.n,
        }));
        const sub = t(v === 'direct' ? 'planDonorSubDirect' : v === 'sink' ? 'planDonorSubSink' : 'planDonorSubLoop');
        plans.push(mk(`doadora${tag}-${kd}-${v}`, 'donor', t('planDonor', multi, kd, v),
          base.map(f => ({ dst: f.dst, mains: f.mains, deficit: f.deficit })), gs,
          pool.filter(l => !used.has(l.id)), { sub, multi }));
      }
    }
  };

  const floorQ = D.map(d => (d.rate <= s + EPS ? 1 : Math.floor(d.rate / s + EPS)));
  if (floorQ.reduce((a, b) => a + b, 0) <= full.length) {
    let i = 0;
    const base = D.map((d, j) => {
      const mains = full.slice(i, i + floorQ[j]); i += floorQ[j];
      return { dst: d, mains, deficit: Math.max(0, d.rate - floorQ[j] * s) };
    });
    donorPlans(base, full.slice(i).concat(rest), floorQ.some(q => q > 1), '');
  }
  if (fit.length === D.length) donorPlans(fit, avail, false, '-encaixe');
  return plans;
}

function rankPlans(evaluated) {
  const cost = a => a.pieces.mergers + a.pieces.splitters + a.pieces.smart;
  return evaluated.slice().sort((a, b) =>
    (b.full - a.full) || (b.served - a.served) * (a.full ? 0 : 1) || cost(a) - cost(b) || a.sinkRate - b.sinkRate);
}

// Plano completo a partir das entradas.
// srcGroups/dstGroups: [{ driver: 'machines'|'clock'|'total', count, clock, nominal, total, per }].
function computePlan(input) {
  const cap = input.cap;
  const policy = input.policy || 'represar';
  const conv = input.conv || 'k-1';
  const srcGroups = input.srcGroups || [{ driver: 'machines', count: input.srcCount, nominal: input.srcRate, per: input.srcPer }];
  const dstGroups = input.dstGroups || [{ driver: 'machines', count: input.dstCount, nominal: input.dstRate, per: input.dstPer }];
  const src = buildLines(srcGroups, cap, t('sideSrc'));
  const dst = buildLines(dstGroups, cap, t('sideDst'));
  const alternatives = rankPlans(generatePlans(src.lines, dst.lines, cap, policy).map(p => evaluatePlan(p, cap)));
  const supply = src.total, demand = dst.total;

  const warnings = [...src.warnings, ...dst.warnings];
  if (demand > supply + EPS) {
    const one = dst.groups.length === 1 && !dst.groups[0].continuous ? dst.groups[0] : null;
    warnings.push({ level: 'bad', text: t('warnDemand', fmt(demand), fmt(supply), one ? fmt(supply / one.nominal, 2) : null) });
  }
  const mixed = l => l.partial && l.comp && l.comp.length && !l.comp[0].total;
  const mixedList = ls => ls.map(l => `${lineComp(l)} = ${fmt(l.rate)}/min`).join('; ');
  const srcMixed = src.lines.filter(mixed);
  if (srcMixed.length) warnings.push({ level: 'warn', text: t('warnCollectMixed', srcMixed.length, mixedList(srcMixed)) });
  const dstMixed = dst.lines.filter(mixed);
  if (dstMixed.length) warnings.push({ level: 'warn', text: t('warnDistMixed', dstMixed.length, mixedList(dstMixed)) });

  return {
    input, cap, conv, policy, src, dst, supply, demand, alternatives, warnings,
    collectMergers: manifoldPieces(src.lines, conv),
    distSplitters: manifoldPieces(dst.lines, conv),
  };
}

function fmt(n, digits = 1) {
  if (!isFinite(n)) return '—';
  const v = Math.abs(n) < 0.05 ? 0 : n;
  return v.toLocaleString(t('locale'), { maximumFractionDigits: digits });
}

// Aceita "65", "65,5", "1.200", "22.5". Em inglês a vírgula é de milhar: "1,200" = 1200.
function parseNum(str) {
  const s = String(str).trim().replace(/\s/g, '').replace(/%$/, '');
  if (!s) return NaN;
  const en = LANG === 'en';
  let norm;
  if (en && /^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) norm = s.replace(/,/g, '');
  else if (s.includes(',')) norm = s.replace(/\./g, '').replace(',', '.');
  else if (!en && /^\d{1,3}(\.\d{3})+$/.test(s)) norm = s.replace(/\./g, '');
  else norm = s;
  return /^-?\d*\.?\d+$/.test(norm) ? Number(norm) : NaN;
}

if (typeof module !== 'undefined') module.exports = { I18N, LANGS, setLang, t, BELTS, resolveGroup, buildLines, lineComp, summarizeRates, manifoldPieces, isDirect, nextDirect, splitTree, describeTree, divisionOptions, mergersFor, waterfill, simulate, generatePlans, evaluatePlan, computePlan, fmt, parseNum };
// LOGIC-END
</script>

  dst: [{ driver: 'machines', count: '60', clock: '', nominal: '40', total: '', per: '' }],
  belt: 'Mk4', policy: 'represar', conv: 'k-1',
};
const STORE = 'sf-balancer:v3';
const LANG_STORE = 'sf-balancer:lang';
let selectedKey = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const O = l => srcTag(l.id);
const Dn = l => dstTag(l.id);

// ---- Idioma ----
// Ordem: ?lang= na URL, escolha salva, inglês.
function pickLang() {

  if (I18N[fromUrl]) return fromUrl;
  let saved = null;
  try { saved = localStorage.getItem(LANG_STORE); } catch (e) { /* sem storage */ }
  if (I18N[saved]) return saved;

}

// Bandeiras em SVG: emoji de bandeira não aparece no Windows.
const FLAGS = {
  pt: `<svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#009c3b"/><path d="M10 1.8 18 7l-8 5.2L2 7z" fill="#ffdf00"/><circle cx="10" cy="7" r="3.1" fill="#002776"/><path d="M7 6.3c2-.6 4.2-.4 6 .7" stroke="#fff" stroke-width=".6" fill="none"/></svg>`,
  en: `<svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#fff"/><path d="M0 0h20v1.08H0zm0 2.15h20v1.08H0zm0 2.16h20v1.07H0zm0 2.15h20v1.08H0zm0 2.16h20v1.07H0zm0 2.15h20v1.08H0zm0 2.15h20V14H0z" fill="#b22234"/><rect width="8.5" height="7.54" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.6" cy="1.4" r=".45"/><circle cx="4.25" cy="1.4" r=".45"/><circle cx="6.9" cy="1.4" r=".45"/><circle cx="2.9" cy="3.77" r=".45"/><circle cx="5.6" cy="3.77" r=".45"/><circle cx="1.6" cy="6.1" r=".45"/><circle cx="4.25" cy="6.1" r=".45"/><circle cx="6.9" cy="6.1" r=".45"/></g></svg>`,
  es: `<svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#aa151b"/><rect y="3.5" width="20" height="7" fill="#f1bf00"/></svg>`,
};

// Textos fixos do HTML (inclusive os dos grupos já clonados do template).
function applyStatic() {
  document.documentElement.lang = t('htmlLang');
  document.title = t('pageTitle');
  document.querySelector('meta[name=description]').content = t('metaDesc');
  const roots = [document, $('grpTpl').content];
  for (const root of roots) {
    root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

  }
  const belt = $('belt').value;
  $('belt').innerHTML = BELTS.map(b => `<option value="${b.id}">${b.id}, ${fmt(b.cap)}/min</option>`).join('');
  $('belt').value = belt || 'Mk4';
  $('langs').innerHTML = LANGS.map(l => `<button type="button" data-lang="${l}" lang="${I18N[l].htmlLang}" title="${I18N[l].langName}" aria-pressed="${l === LANG}">${FLAGS[l]}${l.toUpperCase()}</button>`).join('');
  syncGroups('src');
  syncGroups('dst');
}

// Os números digitados mudam de formato junto com o idioma ("65,5" vira "65.5").
function convertInputs(from) {
  const to = LANG;
  for (const side of ['src', 'dst']) for (const r of rows[side]) for (const k of ['count', 'clock', 'nominal', 'total', 'per']) {
    const raw = r[k].value.trim();
    if (!raw) continue;
    setLang(from);
    const v = parseNum(raw);
    setLang(to);
    if (isFinite(v)) r[k].value = v.toLocaleString(t('locale'), { maximumFractionDigits: 6, useGrouping: false });
  }
}
// Nome de exemplo acompanha o idioma; nome digitado pelo usuário fica.
const itemFor = name => (LANGS.some(x => I18N[x].defaultItem === name) ? t('defaultItem') : name);

function changeLang(l) {
  const prev = LANG;
  setLang(l);
  try { localStorage.setItem(LANG_STORE, LANG); } catch (e) { /* sem storage */ }
  convertInputs(prev);
  $('item').value = itemFor($('item').value);
  applyStatic();
  render();
}

// ---- Grupos de máquinas editáveis (origem e destino) ----
const rows = { src: [], dst: [] };
const CONTAINER = { src: 'srcGroups', dst: 'dstGroups' };

function addGroup(side, v = { driver: 'machines', count: '', clock: '', nominal: '', total: '', per: '' }) {
  const el = $('grpTpl').content.firstElementChild.cloneNode(true);
  const q = c => el.querySelector(c);
  const row = { el, side, driver: v.driver || 'machines', count: q('.g-count'), clock: q('.g-clock'), nominal: q('.g-nom'), total: q('.g-total'), per: q('.g-per'), eq: q('.eq'), name: q('.grp-name'), rm: q('.rm') };
  for (const k of ['count', 'clock', 'nominal', 'total', 'per']) row[k].value = v[k] || '';
  // Quem foi preenchido por último manda; os outros viram equivalência.
  row.count.addEventListener('input', () => {
    if (row.driver === 'total') { row.total.value = ''; row.driver = row.clock.value.trim() ? 'clock' : 'machines'; }
    else row.driver = row.clock.value.trim() ? 'clock' : 'machines';
  });
  row.clock.addEventListener('input', () => {
    if (row.driver === 'total') row.total.value = '';
    row.driver = row.clock.value.trim() ? 'clock' : 'machines';
  });
  row.total.addEventListener('input', () => {
    row.driver = row.total.value.trim() ? 'total' : 'machines';
    if (row.driver === 'total') { row.count.value = ''; row.clock.value = ''; }
  });
  row.rm.addEventListener('click', () => { el.remove(); rows[side].splice(rows[side].indexOf(row), 1); syncGroups(side); render(); });
  $(CONTAINER[side]).append(el);
  rows[side].push(row);
  syncGroups(side);
  return row;
}
function syncGroups(side) {
  rows[side].forEach((r, i) => {
    r.name.textContent = rows[side].length > 1 ? t('groupN', i + 1) : '';
    r.rm.hidden = rows[side].length === 1;
    r.el.querySelector('.g-nom-label').textContent = t(side === 'src' ? 'fNomSrc' : 'fNomDst');
  });
}

function readGroups(side, mark) {
  return rows[side].map(r => {
    const g = { driver: r.driver, per: mark(r.per, 'opt') };
    const nom = mark(r.nominal, r.driver === 'total' ? 'opt' : 'req');
    g.nominal = nom || 0;
    if (r.driver === 'total') { g.total = mark(r.total, 'req'); mark(r.count, 'skip'); mark(r.clock, 'skip'); }
    else {
      g.count = mark(r.count, 'req');
      if (r.driver === 'clock') g.clock = mark(r.clock, 'req'); else mark(r.clock, 'skip');
      mark(r.total, 'skip');
    }
    [r.count, r.clock, r.total].forEach(e => e.classList.remove('drives'));
    ({ machines: r.count, clock: r.clock, total: r.total })[r.driver].classList.add('drives');
    return g;
  });
}

function readInput() {
  let valid = true;
  const mark = (el, kind) => {
    if (kind === 'skip') { el.classList.remove('invalid'); return 0; }
    const raw = el.value.trim();
    const v = parseNum(raw);
    const bad = kind === 'opt' ? (raw !== '' && !(v > 0)) : !(v > 0);
    el.classList.toggle('invalid', bad);
    if (bad) valid = false;
    return raw === '' ? 0 : v;
  };
  const srcGroups = readGroups('src', mark);
  const dstGroups = readGroups('dst', mark);
  const belt = BELTS.find(b => b.id === $('belt').value);
  return {
    valid,
    input: {
      item: $('item').value.trim() || t('fallbackItem'),
